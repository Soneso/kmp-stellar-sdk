name: StellarSmartDemo
options:
  bundleIdPrefix: com.soneso.stellar.smartdemo
  deploymentTarget:
    iOS: 16.0  # Required for passkey support
settings:
  base:
    ARCHS: arm64
    VALID_ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  swift-sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: 0.9.1
  reown-swift:
    url: https://github.com/reown-com/reown-swift
    from: 2.0.0
targets:
  StellarSmartDemo:
    type: application
    platform: iOS
    sources:
      - StellarSmartDemo
    resources:
      - StellarSmartDemo/Assets.xcassets
    info:
      path: StellarSmartDemo/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleURLName: com.soneso.stellar.smartdemo
            CFBundleURLSchemes:
              - stellar-smartdemo
    entitlements:
      path: StellarSmartDemo/StellarSmartDemo.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:soneso.com?mode=developer
        com.apple.security.application-groups:
          - group.com.soneso.stellar.smartdemo
    settings:
      FRAMEWORK_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../../shared/build/bin/iosSimulatorArm64/debugFramework
        - $(SRCROOT)/../../shared/build/bin/iosArm64/debugFramework
      OTHER_LDFLAGS:
        - $(inherited)
        - -framework shared
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework
        embed: true
      - package: swift-sodium
        product: Clibsodium
      - package: reown-swift
        product: WalletConnect
      - package: reown-swift
        product: WalletConnectNetworking
      - package: reown-swift
        product: WalletConnectPairing
    preBuildScripts:
      - script: |
          cd "$SRCROOT/../.."
          if [ "$PLATFORM_NAME" = "iphoneos" ]; then
            ./gradlew :smart-account-demo:shared:linkDebugFrameworkIosArm64
          else
            ./gradlew :smart-account-demo:shared:linkDebugFrameworkIosSimulatorArm64
          fi
        name: Build Kotlin Framework
        basedOnDependencyAnalysis: false
