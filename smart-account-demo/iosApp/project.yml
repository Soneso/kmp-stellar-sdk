name: StellarSmartDemo
options:
  bundleIdPrefix: com.soneso.stellar.smartdemo
  deploymentTarget:
    iOS: 16.0  # Required for passkey support
settings:
  base:
    ARCHS: arm64
    VALID_ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  swift-sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: 0.9.1
targets:
  StellarSmartDemo:
    type: application
    platform: iOS
    sources:
      - StellarSmartDemo
    resources:
      - StellarSmartDemo/Assets.xcassets
    info:
      path: StellarSmartDemo/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: 1
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
    # Passkey Configuration (Required for AppleWebAuthnProvider)
    #
    # To enable passkey authentication in production:
    # 1. Add Associated Domains capability with webcredentials:
    #    entitlements:
    #      com.apple.developer.associated-domains:
    #        - webcredentials:demo.stellar.org
    #
    # 2. Host an apple-app-site-association file at:
    #    https://demo.stellar.org/.well-known/apple-app-site-association
    #
    #    Example content:
    #    {
    #      "webcredentials": {
    #        "apps": ["TEAMID.com.soneso.stellar.smartdemo"]
    #      }
    #    }
    #
    # 3. Update rpId in PlatformInit.ios.kt to match your domain
    #
    # Note: Passkeys may not work on simulator. Test on real devices.
    settings:
      FRAMEWORK_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../../shared/build/bin/iosSimulatorArm64/debugFramework
        - $(SRCROOT)/../../shared/build/bin/iosArm64/debugFramework
      OTHER_LDFLAGS:
        - $(inherited)
        - -framework shared
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework
        embed: true
      - package: swift-sodium
        product: Clibsodium
    preBuildScripts:
      - script: |
          cd "$SRCROOT/../.."
          ./gradlew :smart-account-demo:shared:linkDebugFrameworkIosSimulatorArm64
        name: Build Kotlin Framework
        basedOnDependencyAnalysis: false
