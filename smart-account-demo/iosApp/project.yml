name: StellarSmartDemo
options:
  bundleIdPrefix: com.soneso.stellar.smartdemo
  deploymentTarget:
    iOS: 16.0
settings:
  base:
    ARCHS: arm64
    VALID_ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  swift-sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: 0.9.1
targets:
  StellarSmartDemo:
    type: application
    platform: iOS
    sources:
      - StellarSmartDemo
    resources:
      - StellarSmartDemo/Assets.xcassets
    info:
      path: StellarSmartDemo/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: 1
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      FRAMEWORK_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/../../shared/build/bin/iosSimulatorArm64/debugFramework
        - $(SRCROOT)/../../shared/build/bin/iosArm64/debugFramework
      OTHER_LDFLAGS:
        - $(inherited)
        - -framework shared
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework
        embed: true
      - package: swift-sodium
        product: Clibsodium
    preBuildScripts:
      - script: |
          cd "$SRCROOT/../.."
          ./gradlew :smart-account-demo:shared:linkDebugFrameworkIosSimulatorArm64
        name: Build Kotlin Framework
        basedOnDependencyAnalysis: false
