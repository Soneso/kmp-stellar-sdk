name: Deploy Documentation to GitHub Pages

# The site serves docs/ and the Dokka API reference under api/latest/, both
# built from the tip of main at the time the job starts. Every run of this
# definition, including a re-run, therefore deploys the newest main, and a
# pending run replaced by a newer one loses nothing.

on:
  push:
    branches:
      - main  # Deploy on every push to main
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # A dispatch on another ref skips the job before it joins the group, so it
    # cannot replace a pending deployment of main.
    if: github.ref == 'refs/heads/main'
    # Prevent concurrent deployments. The workflow definitions on the existing
    # release tags use the group "pages"; a separate name keeps them out of this
    # queue.
    concurrency:
      group: "pages-main"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Dokka documentation
        run: ./gradlew :stellar-sdk:dokkaGenerateHtml --no-daemon

      - name: Copy generated docs to latest
        run: |
          # 'latest' exists only in this workspace (gitignored); each deployment
          # rebuilds it from the current Dokka output.
          rm -rf docs/api/latest
          mkdir -p docs/api/latest
          cp -r stellar-sdk/build/dokka/html/* docs/api/latest/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
