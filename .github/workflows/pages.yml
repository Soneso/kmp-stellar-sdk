name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main  # Deploy on every push to main
    tags:
      - 'v*'  # Deploy and persist a versioned docs copy on release tags
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write  # Tag runs commit the versioned docs copy back to main
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Dokka documentation
        run: ./gradlew :stellar-sdk:dokkaGenerateHtml --no-daemon

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Detected version: $VERSION"
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "Using version: latest (manual trigger or non-tag push)"
          fi

      - name: Persist versioned docs copy on release tags
        if: steps.version.outputs.version != 'latest'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # The checkout is at the tag; build the docs commit on top of current main
          # so the versioned directory is served by every later deployment.
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c publish-docs origin/main

          rm -rf "docs/api/$VERSION"
          mkdir -p "docs/api/$VERSION"
          cp -r stellar-sdk/build/dokka/html/* "docs/api/$VERSION/"

          git add "docs/api/$VERSION"
          if git diff --cached --quiet; then
            echo "docs/api/$VERSION is unchanged, nothing to commit"
          else
            git commit -m "Publish API docs for $VERSION [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Copy generated docs to latest
        run: |
          # 'latest' exists only in this workspace (gitignored); each deployment
          # rebuilds it from the current Dokka output.
          rm -rf docs/api/latest
          mkdir -p docs/api/latest
          cp -r stellar-sdk/build/dokka/html/* docs/api/latest/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
