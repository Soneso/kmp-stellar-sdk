version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The published library declares androidx.credentials 1.3.0 as its floor, and the Android
      # host tests declare 1.6.0. A patch update of the 1.6 line can also rewrite the 1.3.0 pin of
      # the same artifact and so raise the floor that apps resolve.
      # The rule suppresses version and security update pull requests for
      # androidx.credentials:credentials.
      - dependency-name: "androidx.credentials:credentials"
      # Reown 1.6.14 and later carry Kotlin 2.4 metadata and require compileSdk 37; the smart
      # account demo builds with Kotlin 2.2.21 and compileSdk 35, so it stays on 1.6.12.
      # The rule suppresses version and security update pull requests for all com.reown artifacts.
      - dependency-name: "com.reown:*"
      # The SDK and smart-account-demo/shared stay on Ktor 3.3.3: Ktor 3.5.2 depends on Kotlin
      # 2.3.21, and the SDK does not compile with it under Kotlin 2.2.21. The JVM demo services
      # build with Ktor 3.6.1. A patch update of the Ktor 3.6 line in one demo module also
      # rewrites the 3.3.3 pins of the same artifacts in every other module, so the patch-only
      # rule does not hold the SDK on 3.3.
      # The rule suppresses version and security update pull requests for all io.ktor artifacts.
      - dependency-name: "io.ktor:*"
  - package-ecosystem: bundler
    directory: /tools/xdrgen-kt
    schedule:
      interval: monthly
    groups:
      bundler:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
